<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button class="yuvarlak">100₺</button>
</body>
<style>
    .yuvarlak{
        height: 60px;
        width: 60px;
        border-radius: 50%;
        background-color: blue;
        border:0;
        animation: kaydir 2s cubic-bezier(0.55, 0.055, 0.675, 0.19) 0s infinite normal both;
    }
    @keyframes kaydir{
        0% { 
            transform: translateX(0px) translateY(0px); 
            background-color: red;
            height: 100px; width:100px;
        }
        25% { 
            transform: translateX(100px) translateY(0px); background-color: black;
            height: 20px; width:20px;
            transform:translateZ(100px);
        }
        50% { transform: translateX(100px) translateY(100px);background-color: blue;}
        75% { transform: translateX(0px) translateY(100px);background-color: pink;}
        100% { transform: translateX(0px) translateY(100px);background-color: orange;}
       
    }
</style>
</html>

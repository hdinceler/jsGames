<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="js.js" defer></script>
</head>
<body>
    <img src="./carrot.png" alt="" class="buton1" id="buton1">
    <img src="./burger.png" alt="" class="buton2" id="buton2">
</body>
<style>
    body {
  cursor: url('./rabbit.png'), auto;
}


@keyframes oynat1 {
    0%{ transform: translateX(0px);  }
    20%{ transform: translateX(100px);  }
    35%{ transform: translateX(75px);  }
    50%{ transform: translateX(90px);  }
    60%{ transform: translateX(10px);  }
    70%{ transform: translateX(30px);  }
    90%{ transform: translateX(50px);  }
    100%{ transform: translateX(0px);  }
}
@keyframes oynat2 {
    0%{ transform: translateX(0px);  }
    20%{ transform: translateX(50px);  }
    35%{ transform: translateX(30px);  }
    50%{ transform: translateX(20px);  }
    60%{ transform: translateX(40px);  }
    70%{ transform: translateX(60px);  }
    90%{ transform: translateX(100px);  }
    100%{ transform: translateX(50px);  }
}
.buton1{
    height: 32px;
    animation: oynat1 5s linear 0s infinite alternate-reverse;
}
.buton2{
    height: 32px;
    animation: oynat2 5s linear 0s infinite alternate;
}
</style>
</html>
